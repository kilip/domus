components:
  schemas:
    core.AuthenticatedUser:
      properties:
        avatar:
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        roles:
          items:
            $ref: '#/components/schemas/core.UserRole'
          type: array
          uniqueItems: false
        scope:
          type: string
      type: object
    core.User:
      properties:
        avatar:
          type: string
        createdAt:
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        updatedAt:
          type: string
      type: object
    core.UserRole:
      enum:
      - admin
      - superadmin
      - user
      type: string
      x-enum-varnames:
      - UserRoleAdmin
      - UserRoleSuperadmin
      - UserRoleUser
    httpx.ErrorBody:
      properties:
        code:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/httpx.FieldError'
          type: array
          uniqueItems: false
        message:
          type: string
      type: object
    httpx.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/httpx.ErrorBody'
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.FieldError:
      properties:
        field:
          type: string
        rule:
          type: string
      type: object
    httpx.Meta:
      properties:
        cursor:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
      type: object
    httpx.WebResponse-array_model_DioceseResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.DioceseResponse'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.WebResponse-array_model_ParishResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.ParishResponse'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.WebResponse-core_AuthenticatedUser:
      properties:
        data:
          $ref: '#/components/schemas/core.AuthenticatedUser'
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.WebResponse-model_DioceseResponse:
      properties:
        data:
          $ref: '#/components/schemas/model.DioceseResponse'
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.WebResponse-model_ParishResponse:
      properties:
        data:
          $ref: '#/components/schemas/model.ParishResponse'
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    model.CreateDioceseRequest:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    model.CreateParishRequest:
      properties:
        address:
          type: string
        church:
          type: string
        dioceseId:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: string
      required:
      - name
      type: object
    model.DioceseResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          $ref: '#/components/schemas/core.User'
        id:
          type: integer
        name:
          type: string
        updatedAt:
          type: string
        updatedBy:
          $ref: '#/components/schemas/core.User'
      type: object
    model.ParishResponse:
      properties:
        address:
          type: string
        church:
          type: string
        diocese:
          $ref: '#/components/schemas/model.DioceseResponse'
        email:
          type: string
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
      type: object
    model.UpdateDioceseRequest:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    model.UpdateParishRequest:
      properties:
        address:
          type: string
        church:
          type: string
        dioceseId:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: string
      required:
      - name
      type: object
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and JWT token.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
