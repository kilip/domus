name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        working-directory: apps/api
        run: go test -v ./...

  test-better-auth:
    name: Test Better Auth
    runs-on: ubuntu-latest
    env:
      AUTH_URL: http://localhost:8001
      AUTH_HOST: 0.0.0.0
      AUTH_PATH: ""
      AUTH_DB_URL: postgres://domus:domus@localhost:5432/domus
      AUTH_SECRET: 6171ce314c622f9a4cdb542c810d40b91edde2f659bcd5224c6aeee7d7ea4925
      API_INTERNAL_URL: http://localhost:8002
      API_INTERNAL_KEY: dev-internal-key-at-least-32-chars-long
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Better Auth tests
        run: bun --filter @domus/better-auth test

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: domus
          POSTGRES_PASSWORD: domus
          POSTGRES_DB: domus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ADDRESS: ":9001"
          RUSTFS_CONSOLE_ENABLE: "true"
        ports:
          - 9000:9000
          - 9001:9001

      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s

    env:
      AUTH_URL: http://localhost:8001
      AUTH_HOST: 0.0.0.0
      AUTH_PATH: ""
      AUTH_DB_URL: postgres://domus:domus@localhost:5432/domus
      AUTH_SECRET: 6171ce314c622f9a4cdb542c810d40b91edde2f659bcd5224c6aeee7d7ea4925
      AUTH_TRUSTED_ORIGINS: http://localhost:3001,http://localhost:8002
      AUTH_JWKS_URL: http://localhost:8001/jwks
      API_INTERNAL_URL: http://localhost:8002
      API_INTERNAL_KEY: dev-internal-key-at-least-32-chars-long
      API_DB_URL: postgres://domus:domus@localhost:5432/domus?sslmode=disable
      SUPERADMIN_EMAIL: admin@domus.local
      SUPERADMIN_NAME: "Super Admin"
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      KAFKA_BROKERS: localhost:9092
      E2E: "true"
      E2E_BASE_URL: http://localhost:3001
      VITE_AUTH_URL: http://localhost:8001
      VITE_PUBLIC_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and dependencies
        run: bunx playwright install --with-deps chromium

      - name: Push Database Schema
        run: bun --filter @domus/better-auth db:push

      - name: Run E2E tests
        run: bun run e2e

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: e2e/reports/
          retention-days: 7

